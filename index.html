(function(){const r=document.documentElement;let t="auto";try{t=localStorage.getItem("alm-theme")||"auto"}catch(e){}
const apply=v=>{if(v==="auto")delete r.dataset.theme;else r.dataset.theme=v;document.querySelectorAll(".theme [data-t]").forEach(b=>{b.classList.toggle("on",b.dataset.t===v);b.setAttribute("aria-pressed",b.dataset.t===v)});};
apply(t);document.querySelectorAll(".theme [data-t]").forEach(b=>b.onclick=()=>{t=b.dataset.t;try{localStorage.setItem("alm-theme",t)}catch(e){}apply(t);});})();
